name: Crawl Facilities

on:
  schedule:
    # 毎週月曜 18:00 UTC（= JST 火曜 AM 3:00）
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ダウンロードをスキップしキャッシュを使う'
        type: boolean
        default: false
      fetch_i2fas:
        description: '厚労省 i2fas オープンデータを再取得する（ブラウザ自動化・時間がかかる）'
        type: boolean
        default: false

permissions:
  contents: write

# gh-pages への push が pages.yml と競合しないよう、配信は常に1本ずつ流す。
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache crawl data
        uses: actions/cache@v4
        with:
          path: .cache
          key: bodik-cache-${{ github.run_id }}
          restore-keys: |
            bodik-cache-

      # 厚労省 i2fas オープンデータの取得（任意）。ブラウザ自動化のため手動 dispatch 時のみ。
      # 取得結果は .cache/i2fas に保存され、以降のクロールでキャッシュから読まれる。
      - name: Fetch i2fas open data (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.fetch_i2fas
        run: |
          npx playwright install --with-deps chromium
          node scripts/fetch-i2fas.mjs
        continue-on-error: true

      # クロールから配信物（結合CSV・ベクトルタイル）の生成までを1コマンドで行う。
      - name: Crawl
        # 全ソース＋i2fas で施設が100万件超になりメモリを要するため、
        # Node のヒープ上限を引き上げる（GitHub Linux ランナーは 16GB RAM）。
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: node scripts/crawl.js --allow-empty-sources ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      # 出典表示ページ（attribution.html）を config/sources.yaml から再生成する。
      # npm test で config との同期を検証するため、Validate より前に実行する。
      - name: Build attribution page
        run: npm run build:attribution

      - name: Validate
        run: npm test

      # 全件CSV（約400MB）を Release アセットとして配信する。
      # gh-pages では配信できない: GitHub は 1ファイル 100MB を上限とし、
      # これを超えるファイルを含む push は拒否される（GH001）。Release アセットは
      # 上限 2GB のため全件CSV をそのまま置ける。
      #
      # タグ data-latest を固定で使い回し、ダウンロード URL を不変に保つ
      # （--clobber で同名アセットを毎週上書きする）。
      - name: Publish merged CSV to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 初回のみリリースを作成する（2回目以降は既存のものを使う）。
          if ! gh release view data-latest >/dev/null 2>&1; then
            gh release create data-latest \
              --title '全件CSV（最新）' \
              --notes '毎週のクロールで更新される全件CSV。詳細は README を参照。'
          fi
          # アセットを上書きアップロード（URL は常に同じ）。
          gh release upload data-latest api/facilities-all.csv --clobber
          # 更新日と件数を本文に反映して、いつ時点のデータか分かるようにする。
          gh release edit data-latest --notes "$(printf '%s\n' \
            "毎週のクロールで更新される全件CSV（BOM なし UTF-8）。" \
            "" \
            "- 更新: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            "- ダウンロード: https://github.com/${GITHUB_REPOSITORY}/releases/download/data-latest/facilities-all.csv" \
            "" \
            "列の定義・ライセンス・利用例は README / llms-full.txt を参照。")"

      # README の統計（件数・サイズ）・出典表示ページ・llms.txt だけを main に反映する。
      # 生成物 api/ は Git 管理せず（.gitignore）、配信は gh-pages のみで行う（履歴肥大を避けるため）。
      # クロール中に他の push で main が進むことがあるため、rebase してリトライする。
      - name: Commit README stats
        run: |
          if git diff --quiet README.md attribution.html llms.txt llms-full.txt; then
            echo "README / attribution.html / llms*.txt 変更なし"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md attribution.html llms.txt llms-full.txt
          git commit -m "chore: update README data stats and attribution page"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed"; exit 0
            fi
            echo "push retry $i..."; sleep 5
          done
          echo "::warning::README stats の push に失敗（gh-pages への配信は別ステップで実施）"

      # 生成した api/ のうち、ベクトルタイルを gh-pages へ配信する。
      # publish_dir が . なので .gitignore も配信対象に含まれてしまう。gh-pages 側では
      # actions-gh-pages が git add --all するため、api/ を無視する .gitignore が
      # 配信先に置かれると生成物が一切コミットされない。必ず除外する。
      #
      # 全件CSV は 100MB 上限を超えるため必ず除外する（含めると push 全体が
      # GH001 で失敗し、タイルもろとも配信されない）。配信は Release アセットで行う。
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: 'node_modules,.cache,scripts,.github,.gitignore,api/facilities-all.csv'
